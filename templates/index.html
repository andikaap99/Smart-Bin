<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BlubBlubFishyEat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4 relative">
  <div class="bg-cyan-800 shadow-xl rounded-xl p-6 sm:p-8 w-full max-w-md flex flex-col items-center">
    <div class="flex flex-col mb-2">
      <h1 class="text-3xl font-bold text-center text-white">BlubBlubFishyEat</h1>
      <h1 class="text-xl font-semibold text-center text-white">Fish Feeder</h1>
      <hr>
    </div>

    <div class="flex flex-col mb-8">
      <table>
        <tr class="text-center text-sm">
          <td>
            <h1 class="text-white font-bold">Status:</h1>
          </td>
          <td>
            <h1 class="text-white"> </h1>
          </td>
          <td>
            <p id="statusText" class="font-bold"> Loading...</p>
          </td>
        </tr>
      </table>
    </div>

    <!-- Preview + Submit -->
    <div id="previewSection" class="flex flex-col justify-center items-center gap-4 w-full">
      <img src="/static/Images/duragoooon.png" class="rounded max-h-64">
      <div class="mt-4 flex flex-col gap-2 items-center w-full">
        <button type="button" onclick="feedFish()" class="bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 w-1/2">Feed</button>
      </div>
    </div>
  </div>

  <script>
    async function fetchStatus() {
      try {
        const res = await fetch("/status");
        const data = await res.json();
        const statusElement = document.getElementById("statusText");
        const feedButton = document.querySelector("button[onclick='feedFish()']");

        if (data.servo_status === 1) {
          statusElement.textContent = "Connected";
          statusElement.classList.add("text-green-400");
          statusElement.classList.remove("text-red-400");

          // Enable tombol Feed
          feedButton.disabled = false;
          feedButton.classList.remove("bg-gray-400", "cursor-not-allowed");
          feedButton.classList.add("bg-blue-600", "hover:bg-blue-700");
        } else {
          statusElement.textContent = "Not Connected";
          statusElement.classList.add("text-red-400");
          statusElement.classList.remove("text-green-400");

          // Disable tombol Feed
          feedButton.disabled = true;
          feedButton.classList.remove("bg-blue-600", "hover:bg-blue-700");
          feedButton.classList.add("bg-gray-400", "cursor-not-allowed");
        }
      } catch (err) {
        console.error("Failed to load status:", err);
        document.getElementById("statusText").textContent = "Status: Error";
      }
    }

    async function feedFish() {
      const response = await fetch('/feed');
      const data = await response.json();

      if (data.servo_feed === 1) {
        alert("Yum Yum Fish Eat Delicioso!");
      } else {
        alert("Servo is not connected or has been run.");
      }
    }

    // Panggil pertama kali
    fetchStatus();
    // Ulangi setiap 3 detik
    setInterval(fetchStatus, 3000);
  </script>
</body>
</html>
